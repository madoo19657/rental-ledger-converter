const lastUsableYear = (y) => { for (const r of RULES.carryYears) if ((r.fromYear == null || y >= r.fromYear) && (r.toYear == null || y <= r.toYear)) return y + r.years; return null; };
/* 해마다 오래된 결손금부터 공제하며 따라간다. policy: 'auto'(공제가 덜 반영된 해는 모두 청구한다고 가정) 또는 청구할 해의 Set.
   청구하는 해는 "가능한 최대 공제"로, 나머지 해는 신고서에 실제로 적힌 공제로 계산한다. */
function simulate(inputs, endYear, policy, amounts) {
  const rows = inputs.slice().sort((a, b) => a.year - b.year);
  const vint = []; let active = [];
  const years = [], candidates = [], assumed = [], over = [];
  let broken = null;
  for (const r of rows) {
    if (r.year > endYear) break;
    if (r.income == null) { broken = r.year; break; }
    active = active.filter((v) => { const last = lastUsableYear(v.year); if (last != null && r.year > last) { v.lost = v.amount - v.used; return false; } return true; });
    const before = {}; vint.forEach((v) => { before[v.year] = v.used; });
    const pool = active.reduce((s, v) => s + (v.amount - v.used), 0);
    const possible = r.income > 0 ? Math.min(pool, r.income) : 0;
    const actual = r.claimed == null ? 0 : r.claimed;
    if (r.claimed == null) assumed.push(r.year);
    const dl = claimDeadline(r.year);
    const wantMore = possible > actual;
    if (wantMore) candidates.push({ year: r.year, income: r.income, actual, possible, state: dl.state, label: dl.label });
    const isClaim = wantMore && dl.state !== 'past' && (policy === 'auto' || policy.has(r.year));
    const target = isClaim && amounts && amounts[r.year] != null ? Math.max(actual, Math.min(possible, amounts[r.year])) : possible;
    let left = isClaim ? target : actual; const cur = {};
    for (const v of active) { if (left <= 0) break; const t = Math.min(v.amount - v.used, left); v.used += t; left -= t; cur[v.year] = t; }
    if (left > 0) over.push({ year: r.year, extra: left });
    active = active.filter((v) => v.amount - v.used > 0);
    if (r.income < 0) { const nv = { year: r.year, amount: -r.income, used: 0, lost: 0 }; vint.push(nv); active.push(nv); }
    const items = vint.map((v) => ({ year: v.year, amount: v.amount, before: before[v.year] || 0, cur: cur[v.year] || 0, lost: v.lost, remain: v.amount - v.used - v.lost, lastYear: lastUsableYear(v.year) }));
    years.push({ year: r.year, income: r.income, balance: r.balance, paid: r.paid, actual, possible, isClaim, applied: (isClaim ? target : actual) - left, items,
      remainAfter: items.reduce((s, x) => s + x.remain, 0), lostTotal: items.reduce((s, x) => s + x.lost, 0) });
  }
  return { years, last: years.find((y) => y.year === endYear) || null, candidates, assumed, over, broken };
}
function claimDeadline(year) {   // 법정신고기한(다음 해 5월 말) + 5년. 확인 필요
  const d = new Date(year + 6, 4, 31), ms = d - NOW;

  const inputs = inputRows(), Y = S.end;

  const auto = simulate(inputs, Y, 'auto');              // 덜 반영된 해를 모두 청구한다고 가정
  const cands = auto.candidates, avail = cands.filter((c) => c.state !== 'past');
  const amtOf = (y) => (S.claimAmt && typeof S.claimAmt[y] === 'number' ? S.claimAmt[y] : null);
  const act = avail.map((c) => c.year).filter((y) => amtOf(y) != null && amtOf(y) > 0);   // 공제금액을 입력한 해 = 청구할 해

  const end = base.last;

  const claimable = act.length > 0;

  const claimYears = selSim.years.filter((y) => y.isClaim);

        { t: '홈택스에서 메뉴 선택', h: `<p style="margin:0 0 8px;font-size:14px">홈택스에 <b>공동·금융인증서로 로그인</b>한 뒤, 상단 메뉴 <b>세금신고</b>에서 아래 순서로 이동합니다.</p>
          ${crumb(['홈택스', '세금신고', '종합소득세 신고', '종합소득세신고(모두채움·일반·근로·분리과세·종교인포함 및 중간예납·토지등매매차익)'])}
          <p style="margin:10px 0 6px;font-size:14px">열린 화면에서 <b>"일반 신고"</b> 카드의 <b>경정청구</b> 버튼을 누릅니다. 누르면 <b>귀속년도 선택</b> 창이 열립니다.</p>
          <div class="mock-card"><div class="mc-t">일반 신고 <i>∧</i></div><div class="mc-b"><span>정기신고</span><span>수정신고</span><span>기한 후 신고</span><span class="on">경정청구<em>여기를 누르세요</em></span><span>파일 변환신고<br>(회계프로그램)</span></div></div>
          ${dots(['"수정신고" 버튼이 아니라 <b>"경정청구"</b> 버튼입니다. 수정신고는 세금을 늘리는 경우에 사용합니다.', '"모두채움 신고 / 단순경비율 신고" 카드나 "기한후 환급신고"가 아니라 <b>"일반 신고"</b> 카드를 사용합니다.'])}${screenNote}` },
        { t: '귀속년도 선택', h: `<p style="margin:0 0 8px;font-size:14px"><b>경정청구</b> 버튼을 누르면 <b>"귀속년도 선택"</b> 창이 열립니다.</p>
          <div class="mock-pop"><div class="mp-h">귀속년도 선택 <i>✕</i></div><div class="mp-b"><p>소득이 발생한 연도를 선택해 주세요.</p><div class="mp-sel"><b>${yr.year}</b> <i>▾</i><em>여기서 ${yr.year}년 선택</em></div></div><div class="mp-btn">적용하기<em>선택 후 누르세요</em></div></div>
          ${dots([`"소득이 발생한 연도"는 경정청구할 <b>귀속연도</b>입니다. <b>${yr.year}</b>년을 선택하고 <b>적용하기</b>를 누릅니다.`, '적용하기를 누르면 신고서 <b>기본정보</b> 화면이 열립니다. 이 화면에는 신고구분을 고르는 칸이 없고, 앞에서 누른 <b>경정청구</b> 버튼으로 정해집니다.'])}` },
        { t: '기본정보·신고서 불러오기', h: `<p style="margin:0 0 8px;font-size:14px"><b>기본정보</b> 화면 오른쪽 위의 <b>[신고서불러오기]</b> 버튼을 눌러 ${yr.year}년 종합소득세로 제출한 기존 신고서를 불러옵니다. <b>[새로작성하기]</b>가 아닙니다.</p>
          <div class="mock-top"><span>신고안내 동영상</span><span>전자신고 매뉴얼</span><span>새로작성하기</span><span class="on">신고서불러오기<em>여기를 누르세요</em></span></div>
          ${dots([`<b>소득발생년도</b>가 ${yr.year}인지 확인합니다.`, '같은 해에 신고가 여러 번 있었다면 <b>가장 마지막(최종) 신고서</b>를 불러옵니다.', '주민등록번호의 <b>[확인]</b> 버튼 등 나머지 기본정보는 불러온 값 <b>그대로 두고</b>, 화면 아래 <b>[작성완료]</b>를 눌러 다음으로 이동합니다. 이 도구는 개인정보를 묻지 않습니다.', '<b>[작성완료]</b>를 누르면 <b>"종합(분리)소득금액"</b> 화면이 열립니다. 불러온 <b>사업소득</b>과 <b>근로소득</b> 카드에 체크(✓)와 금액이 이미 표시되어 있습니다. 그대로 두고 삭제하지 않습니다.', '이번 청구는 <b>이월결손금 공제만</b> 다룹니다. 다른 항목(간주임대료, 세액공제 등)은 변경하지 않는 것을 권장합니다. 다른 숫자를 고치면 쟁점이 늘어 심사가 복잡해질 수 있습니다.'])}` },
        { t: '이월결손금 명세서 입력', h: `<p style="margin:0 0 8px;font-size:14px">"종합(분리)소득금액" 화면 <b>왼쪽 요약 패널</b>에서 <b>"(이월)결손금"</b> 아래의 <b>"결손금·이월결손금공제명세서"</b> 링크를 누릅니다. 패널에 보이지 않으면 위쪽 <b>"전체항목 보기"</b> 스위치를 켭니다. 열린 <b>"(이월)결손금 및 세액감면·공제신청서 및 산출세액계산서"</b> 화면에서 <b>(이월)결손금</b> 묶음의 <b>[종합소득금액 및 결손금·이월결손금공제명세서]</b> 버튼을 누릅니다. 옆의 [결손금 소급공제세액 환급신청서]는 누르지 않습니다. 그러면 열리는 명세서 화면 맨 아래의 <b>⑩ "이월결손금 명세서"</b>에서 <b>"입력하기"</b>를 눌러 줄을 추가합니다. 위쪽 묶음 <b>"부동산임대업의 사업소득(주택임대업 제외)"</b>에 아래 <b>${yr.items.length}개 줄</b>을 입력하세요. 숫자는 눌러서 복사할 수 있습니다.</p>
          ${dots(['⑩ 표 아래 입력 칸은 <b>소득구분</b>(30 부동산임대업의 사업소득) · <b>발생과세기간</b> · 이월결손금 <b>발생금액</b> · <b>전기까지의 공제액</b> · <b>당기공제액</b> · <b>그 밖의 공제액</b> 순서입니다. 소급공제액과 잔액은 입력하지 않고(회색 칸), 잔액은 자동 계산됩니다. 한 줄을 채우고 <b>[입력하기]</b>를 누르면 위 표에 줄이 추가됩니다.', '신고서에서 불러온 줄이 이미 있으면 새로 추가하지 말고 그 줄 오른쪽 <b>[수정]</b>으로 고칩니다. 같은 연도 줄이 두 번 생기지 않게 합니다. 잘못 넣은 줄은 <b>[삭제]</b>(✕)로 지웁니다.', '<b>"전년도 이월결손금 내역 불러오기"</b>(⑩ 제목 오른쪽 버튼)는 누르지 마세요. 이전 값이 입력될 수 있습니다.', '잔액이 0인 줄(전액 공제된 손실)도 발생금액과 전기까지 공제액을 함께 입력해야 자동 계산이 맞습니다. 잔액 0인 줄이 화면에서 자동으로 빠지면 그대로 두세요.'])}
          ${rowCards}` },
        { t: '위쪽 표에 합계 확인', h: `<p style="margin:0 0 6px;font-size:14px">화면 위쪽 <b>⑨ 종합소득금액 및 결손금·이월결손금공제명세서</b> 표에서 <b>"부동산임대업의 사업소득금액(주택임대업 제외)"</b> 줄의 <b>④ 칸</b>에 당기공제액 합계 ${chip(yr.applied)}이 입력되어 있어야 합니다.</p>
          ${dots(['아래 명세서를 입력하면 자동으로 채워질 수 있습니다. 비어 있으면 직접 입력하세요. 표 아래에 "이월결손금 공제금액이 있는 경우에는 아래 이월결손금 명세서를 입력하세요"라는 안내가 있습니다.', '입력을 마치면 화면 맨 아래 <b>[작성완료]</b>를 눌러 다음으로 이동합니다.', '<b>⑤ 공제 후 소득금액</b>은 ① 소득금액에서 공제액을 뺀 값으로 자동 계산됩니다.'])}
          ${illus('claimed')}<p class="sm"><b>③ 칸에는 입력하지 마세요.</b> ③은 부동산임대업 <u>외</u>의 사업소득용 칸이며, ④ 바로 옆에 있어 혼동하기 쉽습니다.</p>` },
        { t: '세액 계산 화면 확인', h: `<p style="margin:0 0 8px;font-size:14px">명세서에서 <b>[작성완료]</b>를 누르면 <b>"납부(환급)할 세액"</b> 화면이 열립니다. 위쪽 <b>"신고기한이내 납부(환급)할 세액"</b>의 <b>종합소득세</b> 금액과 화면 <b>왼쪽 요약 패널</b>(종합소득금액·소득공제금액·세액공제·감면금액·가산세·기납부세액·환급할 세액)에서 입력이 맞게 반영됐는지 확인하세요. 종합소득세가 <b>마이너스(−)</b>이면 환급입니다.</p>
          ${dots([`<b>종합소득금액이 ${fmt(inc)}원 줄었는지</b> 확인합니다(신고서에 이미 반영된 ${fmt(yr.actual)}원을 제외한 추가분).`, `각 줄의 <b>잔액</b>이 앞 화면 카드의 잔액과 같은지 확인합니다.`, `발생 − 전기까지 − 당기${lost ? ' − 소멸' : ''} = 잔액: ${fmt(sumA)} − ${fmt(sumB)} − ${fmt(yr.applied)}${lost ? ' − ' + fmt(lost) : ''} = <b>${fmt(eq)}</b> ${eq === yr.remainAfter ? '✓' : '(확인 필요)'}`, `당기공제 ${fmt(yr.applied)}원 ≤ ${yr.year}년 임대소득 ${fmt(yr.income)}원 ${yr.applied <= yr.income ? '✓' : '(확인 필요)'}`])}
          <p class="sm">이 화면의 "환급할 세액"은 결정세액과 <b>기납부세액(원천징수)</b>의 차이만 보여 줍니다. 이미 낸 세금까지 합친 <b>환급받을 세액</b>은 경정청구서 미리보기에 표시됩니다(최초 납부할 세액 + 경정 환급액). 이 도구는 환급액을 계산하지 않습니다.</p>` },
        { t: '환급계좌 입력', h: `<p style="margin:0 0 8px;font-size:14px">같은 <b>"납부(환급)할 세액"</b> 화면 맨 아래 <b>"나의 환급계좌"</b>에서 <b>은행</b>을 선택하고 <b>계좌번호</b>를 홈택스에서 직접 입력한 뒤 <b>[작성완료]</b>를 누릅니다.</p>
          ${dots(['<b>본인 명의 계좌만</b> 가능합니다. 이 도구는 계좌번호를 묻지 않습니다.', '위쪽의 <b>추가 세액 입력</b>(추가납부세액, 농어촌특별세)과 <b>분납할 세액 입력</b>은 이번 청구에서 <b>0 그대로</b> 둡니다.', '환급액이 <b>500만 원을 넘으면</b> 환급계좌개설(변경)신고 안내가 표시될 수 있습니다. 이 경우 먼저 계좌를 등록하세요.'])}` },
        { t: '경정청구서 미리보기·청구이유', h: `<p style="margin:0 0 8px;font-size:14px"><b>"경정청구 신고서"</b> 창에서 <b>신고내용</b>의 <b>결정(경정)청구이유</b>를 고르고, 표의 <b>최초신고 / 결정(경정)청구</b> 금액이 예상과 맞는지 확인합니다. 마치면 창 아래 <b>[입력완료]</b>를 누릅니다.</p>
          ${dots(['표의 <b>최초신고</b> 칸(과세표준액·산출세액·공제 및 감면세액·납부할 세액 등)은 불러온 신고서의 금액입니다. <b>고치지 마세요.</b> 오른쪽 회색 <b>결정(경정)청구</b> 칸이 이월결손금 공제를 반영한 금액으로 자동 계산됩니다. 과세표준과 산출세액이 최초신고보다 줄었는지 확인합니다.', '법정신고일과 최초신고일은 자동으로 표시됩니다. 국세환급금계좌와 청구인 인적사항도 앞 화면 내용이 표시되며 이 창에서 따로 입력하지 않습니다.', '드롭다운에 이월결손금 전용 항목이 없어 <b>"수입금액 - 기타"</b>를 선택하고 아래 칸에 직접 입력합니다.', `문구 예시: <b>"부동산임대업 이월결손금 공제 누락(${rowYears}년 발생 손실 중 ${fmt(inc)}원 공제)"</b>`, '청구이유는 <b>한 칸만</b> 쓰세요. 두 칸에 같은 항목을 넣으면 "경정청구이유2는 1과 다른 이유를 입력해야 합니다" 오류가 발생합니다.', '세무대리인 칸은 직접 신고하면 비워 둡니다.'])}` },
        { t: '제출', h: `<p style="margin:0 0 8px;font-size:14px">모두 확인했으면 <b>제출</b>하세요.</p>
          ${dots(['제출 오류가 발생하면 "신고서 제출이 불가능합니다" 창에 서식명·항목명·사유가 표시됩니다. 내용대로 수정한 뒤 다시 제출하세요.', '제출이 끝나면 <b>접수증을 저장</b>하세요. 메뉴: 세금신고 &gt; 신고서 조회/삭제/부속서류 &gt; 전자신고 접수증·납부서 출력', '접수번호도 메모해 두세요.'])}` },
        { t: '제출 후 할 일', h: `<div class="st2">증빙 서류 올리기</div>${crumb(['세금신고', '신고서 조회/삭제/부속서류', '신고부속서류 제출'])}
          ${dots([`손실이 발생한 연도(${rowYears}년)의 종합소득세 신고서`, '앞선 수정신고·경정청구가 있었다면 그 결과 통지 내용', `${yr.year}년 종합소득세 신고서 (최종본)`])}

          <details class="more"><summary>자주 하는 실수</summary>${dots(['이월결손금을 <b>③ 칸</b>이나 아래쪽 <b>"부동산임대업 외"</b> 묶음에 입력한다', '발생금액만 적고 <b>전기까지 공제액을 빠뜨려</b> 이중 공제가 된다', '"전년도 내역 불러오기"의 <b>옛 숫자</b>를 그대로 둔다', '<b>수정신고</b>를 고른다 (환급은 경정청구)', '앞선 경정청구가 <b>승인</b>됐는지 확인하지 않는다 (결과는 신고서보기가 아니라 환급금 상세조회·결정 통지서에서 확인)'])}</details>

  },
};

/* ---------- 렌더 & 이벤트 ---------- */

document.getElementById('hBack').addEventListener('click', () => goBack());
// 좁은 화면에서 표를 카드로 보여 줄 때 쓸 칸 이름을 각 칸에 붙인다

const $q = (s) => $app.querySelector(s);
function bind() {
  const on = (sel, fn) => { const el = $q(sel); if (el) el.addEventListener('click', fn); };
  on('#back', goBack);
  const step = S.step;
  if (step === 0) {
    on('#mine', () => { S.mode = 'mine'; S.start = THIS_TAX_YEAR - 5; S.end = THIS_TAX_YEAR; S.data = {}; S.yIdx = 0; go(1); });

  }

        const y = +inp.dataset.amt, P0 = planInfo(), yr = P0.selSim.years.find((z) => z.year === y);
        const v = parseAmt(inp.value), c = candOf(y), act = c ? c.actual : 0, room = c ? Math.max(0, c.income - act) : 0;
        const cap = yr ? Math.max(0, Math.min(room, yr.possible - act)) : room;
        S.amtMsg = undefined;
        if (v != null && v > 0 && v > cap) {
          S.claimAmt = Object.assign({}, S.claimAmt, { [y]: '' });
          const text = v > room ? `입력한 공제할 이월결손금 ${fmt(v)}원이 공제가능금액 ${fmt(room)}원보다 큽니다.<br>${fmt(room)}원 이하로 입력하세요.` : `남은 이월결손금으로는 ${y}년에 최대 ${fmt(cap)}원까지 공제할 수 있습니다.<br>${fmt(cap)}원 이하로 입력하세요.`;
          const sy = window.scrollY; render(); window.scrollTo(0, sy);
          showError(`${y}년 공제금액 오류`, text);
          return;
        }
        commitAmt(y, inp.value);
        const sy = window.scrollY; render(); window.scrollTo(0, sy);
      });
    });
  }
  if (step === 6) {
    bindCopy();
    $app.querySelectorAll('[data-cv]').forEach((b) => b.addEventListener('click', () => copyText(b.dataset.cv, b)));
    const P6 = planInfo();
    if (P6.plan === 'claim') {
      const cys = P6.claimYears.map((y) => y.year), vy = claimViewYear(P6), nextY = cys[cys.indexOf(vy) + 1];
      on('#next', () => { if (nextY != null) { S.claimView = nextY; render(); window.scrollTo(0, 0); } else go(7); });
      on('#backList', () => go(5));
      const hxGo = (d) => { S.hx = Object.assign({}, S.hx, { [vy]: Math.max(0, ((S.hx && S.hx[vy]) || 0) + d) }); render(); window.scrollTo(0, 0); };
      on('#hxPrev', () => hxGo(-1)); on('#hxNext', () => hxGo(1));
      on('#hxDone', () => { S.claimDone = [...new Set([...(S.claimDone || []), vy])]; go(5); });
      $app.querySelectorAll('[data-hx]').forEach((b) => b.addEventListener('click', () => { S.hx = Object.assign({}, S.hx, { [vy]: +b.dataset.hx }); render(); window.scrollTo(0, 0); }));
      const dt = $q('#doneToggle'); if (dt) dt.addEventListener('change', () => { const set = new Set(S.claimDone || []); if (dt.checked) set.add(vy); else set.delete(vy); S.claimDone = [...set]; });
    } else on('#next', () => go(7));
  }
  if (step === 7) {
    on('#restart', () => { Object.assign(S, { step: 0, mode: null, yIdx: 0, data: {}, checks: [false, false, false], plan: undefined }); render(); });
    bindCopy();
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && S.step !== 3 && !/^(BUTTON|SELECT|INPUT|A|SUMMARY)$/.test(document.activeElement.tagName)) { const n = document.getElementById('next'); if (n && !n.disabled) n.click(); }
});

/* ---------- 이월결손금 처리 기한 안내 (기준 확인 필요 알약) ---------- */
function ruleHtml() {
  const rows = RULES.carryYears.map((r) => {
    const span = r.toYear ? `${r.fromYear}~${r.toYear}년 발생분` : `${r.fromYear}년 이후 발생분`;
    const ex = r.toYear ? `${r.fromYear}년분 → ${r.fromYear + r.years}년 귀속까지<br>${r.toYear}년분 → ${r.toYear + r.years}년 귀속까지` : `2021년분 → ${2021 + r.years}년 귀속까지<br>2022년분 → ${2022 + r.years}년 귀속까지`;
    const st = r.years === 15 ? '<span class="st ok">조문 확인</span><br><small>적용 시작 시점은 부칙 확인 필요</small>' : '<span class="st pend">2차 자료만</span><br><small>조문·부칙 직접 확인 전</small>';
    return `<tr><td>${span}</td><td><b>${r.years}년</b></td><td>${ex}</td><td>${st}</td></tr>`;
  }).join('');
  return `<p>발생한 손실(이월결손금)은 <b>발생한 과세기간 종료일부터 N년 이내에 끝나는 과세기간</b>까지만 공제할 수 있고, <b>오래된 것부터</b> 순서대로 <b>부동산임대업 소득</b>에서만 뺍니다.</p>
    <table><thead><tr><th>발생 시기</th><th>공제 기한</th><th>예시</th><th>확인 상태</th></tr></thead><tbody>${rows}</tbody></table>
    <b>함께 알아 둘 것</b>
    <ul><li><b>추계신고를 한 해</b>에는 이월결손금 공제가 적용되지 않습니다.</li>
    <li>국세부과 <b>제척기간이 지난 뒤</b> 확인된 이월결손금은 공제하지 않습니다.</li>
    <li>2018년 이전 발생분의 기한은 이 도구에서 계산하지 않습니다(2차 자료상 2009년분부터 10년으로 알려져 있으나 미확인).</li></ul>
    <div class="box warn" style="margin:12px 0 0;font-size:13px">법령 원문 중 개정 부칙은 아직 직접 확인하지 못했습니다. 청구나 신고 전에 세무사에게 확인하세요.</div>
    <div class="src">근거: 소득세법 제45조 제2~4항 · 확인일 2026-11-03 · <a href="https://casenote.kr/%EB%B2%95%EB%A0%B9/%EC%86%8C%EB%93%9D%EC%84%B8%EB%B2%95/%EC%A0%9C45%EC%A1%B0" target="_blank" rel="noopener">조문 보기</a></div>`;
}
function showError(title, html) {
  let d = document.getElementById('errDlg');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'errDlg'; d.className = 'rule err';
    d.innerHTML = '<div class="rh"><h2></h2><button type="button" class="x" aria-label="닫기">×</button></div><div class="rb"><p class="em"></p><div class="row-btn"><button type="button" class="btn primary" id="errOk">확인</button></div></div>';
    const close = () => d.close();
    d.querySelector('.x').addEventListener('click', close);
    d.querySelector('#errOk').addEventListener('click', close);
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    document.body.appendChild(d);
  }
  d.querySelector('h2').textContent = title;
  d.querySelector('.em').innerHTML = html;
  d.showModal();
}
function openRule() {
  let d = document.getElementById('ruleDlg');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'ruleDlg'; d.className = 'rule';
    d.innerHTML = '<div class="rh"><h2>이월결손금 처리 기한</h2><button type="button" class="x" aria-label="닫기">×</button></div><div class="rb"></div>';
    d.querySelector('.x').addEventListener('click', () => d.close());
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    document.body.appendChild(d);
  }
  d.querySelector('.rb').innerHTML = ruleHtml();
  d.showModal();
}
document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('[data-rule]')) openRule(); });
render();
</script>
</body>
